<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnLine — Queue Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- LOGIN -->
    <div id="login-view" class="login-page">
        <div class="login-card">
            <h1>OnLine</h1>
            <p class="subtitle" id="auth-subtitle">UPV Smart Queue Management</p>
            <div class="form-group">
                <label for="login-user">Username</label>
                <input type="text" id="login-user" name="username" autocomplete="username" placeholder="e.g. admin_reyes">
            </div>
            <div class="form-group">
                <label for="login-pass">Password</label>
                <div class="password-wrap">
                    <input type="password" id="login-pass" name="password" autocomplete="current-password" placeholder="Password">
                    <button type="button" class="password-toggle" id="pass-toggle" aria-label="Show password" aria-pressed="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button class="btn btn-primary btn-block" id="login-btn">Sign In</button>
            <button class="btn btn-block" id="register-btn" style="margin-top:0.5rem;display:none">Create Account</button>
            <p id="login-error" class="text-sm mt-1" style="color:var(--danger)" role="alert" aria-live="assertive"></p>
            <p class="text-sm text-dim mt-1" style="text-align:center">
                <a href="#" id="toggle-mode" style="color:var(--accent);font-weight:500">Don't have an account? Sign up</a>
            </p>
        </div>
    </div>

    <!-- APP SHELL (hidden until login) -->
    <div id="app-view" class="app-shell hidden">
        <aside class="sidebar" aria-label="Primary navigation">
            <div class="sidebar-brand">
                <h1>OnLine</h1>
                <small>Queue System</small>
            </div>
            <nav id="sidebar-nav" aria-label="Sections">
                <!-- populated by JS based on role -->
            </nav>
            <div class="sidebar-footer">
                <div class="user-badge">
                    <span id="user-display"></span>
                    <span class="role-tag" id="role-display"></span>
                </div>
                <button id="inbox-btn" class="icon-btn" type="button" aria-label="Switch requests" onclick="openSwitchInbox()">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
                    </span>
                    <span class="label">Switch Requests</span>
                    <span id="inbox-badge" class="inbox-badge hidden" aria-label="0 pending requests">0</span>
                </button>
                <button id="logout-btn" class="icon-btn" type="button" aria-label="Sign out">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </span>
                    <span class="label">Sign out</span>
                </button>
            </div>
        </aside>
        <main class="main-area" id="main-content" tabindex="-1"></main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/pages.js"></script>
    <script>
        /* ── ICON LIBRARY (Lucide-style) ── */
        const ICONS = {
            dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>',
            board:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
            queues:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
            services:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h2M9 13h2M9 17h2M13 9h2M13 13h2M13 17h2"/></svg>',
            staff:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
            users:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="18" cy="9" r="2"/><path d="M21 21v-1a3 3 0 0 0-3-3"/></svg>',
        };
        const EYE_OPEN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
        const EYE_OFF   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.06 10.06 0 0 1 12 19c-6.5 0-10-7-10-7a18.05 18.05 0 0 1 4.06-5.06"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.16 18.16 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';

        /* ── PASSWORD TOGGLE ── */
        document.getElementById('pass-toggle').addEventListener('click', () => {
            const input = document.getElementById('login-pass');
            const btn   = document.getElementById('pass-toggle');
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            btn.setAttribute('aria-pressed', String(!showing));
            btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
            btn.innerHTML = showing ? EYE_OPEN : EYE_OFF;
        });

        /* ── BOOT ── */
        (async () => {
            try {
                const res = await API.session();
                if (res.user) loginSuccess(res.user);
            } catch {}
        })();

        /* ── AUTH MODE TOGGLE ── */
        let authMode = 'login';
        function setAuthMode(mode) {
            authMode = mode;
            const isReg = mode === 'register';
            document.getElementById('login-btn').style.display    = isReg ? 'none' : '';
            document.getElementById('register-btn').style.display = isReg ? '' : 'none';
            document.getElementById('toggle-mode').textContent    = isReg
                ? 'Already have an account? Sign in'
                : "Don't have an account? Sign up";
            document.getElementById('auth-subtitle').textContent  = isReg
                ? 'Create a customer account'
                : 'UPV Smart Queue Management';
            document.getElementById('login-error').textContent = '';
            // Update autocomplete hints for password manager UX
            document.getElementById('login-pass').autocomplete = isReg ? 'new-password' : 'current-password';
        }
        document.getElementById('toggle-mode').addEventListener('click', e => {
            e.preventDefault();
            setAuthMode(authMode === 'login' ? 'register' : 'login');
        });

        /* ── LOGIN ── */
        document.getElementById('login-btn').addEventListener('click', async () => {
            await submitAuth('login-btn', () => API.login(
                document.getElementById('login-user').value.trim(),
                document.getElementById('login-pass').value
            ));
        });

        /* ── REGISTER ── */
        document.getElementById('register-btn').addEventListener('click', async () => {
            await submitAuth('register-btn', () => API.register(
                document.getElementById('login-user').value.trim(),
                document.getElementById('login-pass').value
            ));
        });

        async function submitAuth(btnId, fn) {
            const btn = document.getElementById(btnId);
            const errEl = document.getElementById('login-error');
            errEl.textContent = '';
            setLoading(btn, true);
            try {
                const res = await fn();
                loginSuccess(res.user);
            } catch (err) {
                errEl.textContent = err.message;
            } finally {
                setLoading(btn, false);
            }
        }

        document.getElementById('login-pass').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                if (authMode === 'register') document.getElementById('register-btn').click();
                else document.getElementById('login-btn').click();
            }
        });

        /* ── LOGOUT ── */
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await API.logout();
            stopSwitchPolling();
            currentUser = null;
            setAuthMode('login');
            document.getElementById('login-user').value = '';
            document.getElementById('login-pass').value = '';
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('login-view').style.display = '';
        });

        /* ── POST-LOGIN SETUP ── */
        function loginSuccess(user) {
            currentUser = user;
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('app-view').classList.remove('hidden');
            document.getElementById('user-display').textContent = user.username;
            document.getElementById('role-display').textContent = user.role;

            const nav = document.getElementById('sidebar-nav');
            const items = [['dashboard', 'Dashboard']];
            if (['staff', 'admin'].includes(user.role)) {
                items.push(['board', 'Queue Board'], ['queues', 'Queue Records'],
                           ['services', 'Services'], ['staff', 'Staff']);
            } else {
                items.push(['queues', 'My Queues']);
            }
            if (user.role === 'admin') items.push(['users', 'Users']);

            nav.innerHTML = items.map(([page, label]) =>
                `<a href="#" data-page="${page}" aria-label="${label}">
                    <span class="icon" aria-hidden="true">${ICONS[page] || ''}</span>
                    <span class="label">${label}</span>
                </a>`
            ).join('');

            nav.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', e => {
                    e.preventDefault();
                    navigate(a.dataset.page);
                });
            });

            startSwitchPolling();
            navigate('dashboard');
        }
    </script>
</body>
</html>
